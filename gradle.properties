org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableR8=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
kotlin.code.style=official
org.gradle.caching=true

# Be tolerant of slow / flaky internet connections
systemProp.org.gradle.internal.repository.max.retries=15
systemProp.org.gradle.internal.repository.initial.backoff=250
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.initial.connection.idle.timeout=120000